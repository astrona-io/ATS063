# Final domain knowledge check across both sections.
schema_version: 1
kind: question_bank
id: ats063-final
course_id: ATS063
exam_code: CAPA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: argo-events
  title: "Argo Events"
questions:
  - id: ats063-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the four stages of an Argo Events pipeline and the component
      that does the work in each
    source_readings:
    - sections/section-010/module-01/course-01-events-and-the-four-stages.md
    prompt: An HTTP request arrives at a pipeline and ends up as a new Workflow in the
      cluster. Which sequence of components handles it?
    options:
    - id: a
      text: Sensor, then EventBus, then EventSource, then trigger.
      explanation: The Sensor is the consumer of events. It cannot come before the component
        that receives the request.
    - id: b
      text: EventSource, then Sensor, then EventBus, then trigger.
      explanation: The EventBus sits between the EventSource and the Sensor. The Sensor
        reads events from the bus.
    - id: c
      text: EventSource, then EventBus, then Sensor, then trigger.
      explanation: Correct. The EventSource receives the request and publishes it to
        the bus, the Sensor reads it from the bus and decides, and the trigger performs
        the action.
    - id: d
      text: EventBus, then EventSource, then trigger, then Sensor.
      explanation: The bus carries events, it does not produce them, and the trigger
        is part of the Sensor.
    correct_option: c
    explanation: The EventSource receives or watches for occurrences and publishes them
      to the EventBus. The Sensor reads from the bus, evaluates its dependencies and
      filters, and runs its triggers.
  - id: ats063-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Connect a Sensor dependency to the right EventSource and event
      name
    source_readings:
    - sections/section-010/module-01/course-02-building-the-first-pipeline.md
    prompt: 'An EventSource named `webhook` has the spec `webhook: {example: {port:
      "12000", endpoint: /example, method: POST}}`. A Sensor dependency is named `example-dep`.
      Which `eventSourceName` and `eventName` must the dependency use?'
    options:
    - id: a
      text: "`eventSourceName: webhook` and `eventName: example`."
      explanation: Correct. The EventSource name is `metadata.name`, and the event name
        is the key under the event source type.
    - id: b
      text: "`eventSourceName: example-dep` and `eventName: example`."
      explanation: The dependency name is only a label for the trigger parameters. It
        is not the EventSource name.
    - id: c
      text: "`eventSourceName: webhook` and `eventName: /example`."
      explanation: The event name is the key `example`, not the endpoint path.
    - id: d
      text: "`eventSourceName: example` and `eventName: webhook`."
      explanation: The two values are swapped. The type key `webhook` is not an event
        name.
    correct_option: a
    explanation: eventSourceName is the metadata.name of the EventSource, and eventName
      is the key of the event under the type. The dependency name only labels the dependency
      inside the Sensor.
  - id: ats063-final-q03
    type: single_choice
    difficulty: beginner
    learning_objective: Explain the difference between an EventSource name and an event
      name and the uniqueness rule for event names
    source_readings:
    - sections/section-010/module-02/course-01-webhook-endpoints-and-access.md
    prompt: An EventSource named `gateway` has the events `order` and `status` under
      `spec.webhook`. A Sensor must react to `status` only. Which dependency is correct?
    options:
    - id: a
      text: "`eventSourceName: gateway` and `eventName: status`."
      explanation: Correct. The EventSource name is `metadata.name`, and the event name
        is the key under the type.
    - id: b
      text: "`eventSourceName: webhook` and `eventName: status`."
      explanation: "`webhook` is the type of the events, not the name of the EventSource."
    - id: c
      text: "`eventSourceName: status` and `eventName: gateway`."
      explanation: The two values are swapped.
    - id: d
      text: "`eventSourceName: gateway` and `eventName: /status`."
      explanation: The event name is the map key, not the endpoint path.
    correct_option: a
    explanation: A dependency is the pair of the EventSource name and the event name.
      The type key `webhook` is neither of them.
  - id: ats063-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose between an interval and a schedule and read the data
      of a calendar event
    source_readings:
    - sections/section-010/module-02/course-02-calendar-events-from-time.md
    prompt: 'A calendar event has `metadata: {ship: scout}`. Which trigger parameter
      `dataKey` reads the text `scout`?'
    options:
    - id: a
      text: "`body.ship`"
      explanation: A calendar event has no request body.
    - id: b
      text: "`ship`"
      explanation: The static payload is under the field `metadata`.
    - id: c
      text: "`eventTime.ship`"
      explanation: "`eventTime` is the time of the event, a single value."
    - id: d
      text: "`metadata.ship`"
      explanation: Correct. The data of a calendar event has the fields `eventTime`
        and `metadata`.
    correct_option: d
    explanation: The static metadata of a calendar event is delivered in the data field
      metadata, so the path is metadata.ship.
  - id: ats063-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: Explain that a Sensor with several dependencies and no conditions
      waits for all of them
    source_readings:
    - sections/section-010/module-03/course-01-sensor-anatomy-and-dependencies.md
    prompt: A Sensor has two dependencies, `build` and `approve`, and one trigger with
      no `conditions`. Only an event for `build` arrives, and no event for `approve`
      ever arrives. What happens?
    options:
    - id: a
      text: The trigger runs once, because one dependency is enough.
      explanation: One dependency is enough only when a condition says so.
    - id: b
      text: The Sensor reports an error, because the second dependency timed out.
      explanation: A missing event is not an error. The Sensor keeps waiting.
    - id: c
      text: The trigger does not run, because the default rule needs every dependency
        to deliver an event.
      explanation: Correct. Without `conditions` the trigger waits until all dependencies
        are satisfied.
    - id: d
      text: The trigger runs, but the parameters of the missing dependency stay empty.
      explanation: The trigger does not run at all while a dependency is missing.
    correct_option: c
    explanation: The default rule is an AND of all dependencies. A Sensor that must
      react to either event needs a condition with an or.
  - id: ats063-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose the parameter operation that keeps an existing prefix
      in a generated name
    source_readings:
    - sections/section-010/module-03/course-02-passing-event-data-to-triggers.md
    prompt: 'A trigger resource has `metadata.generateName: report-`. A parameter writes
      the event name `nightly` to `metadata.generateName`. The new object must have
      a name that starts with `report-nightly`. Which operation does that?'
    options:
    - id: a
      text: "`append`, which puts the new value after the old one."
      explanation: Correct. The old value `report-` is followed by `nightly`.
    - id: b
      text: "`prepend`, which puts the new value before the old one."
      explanation: This gives `nightlyreport-`.
    - id: c
      text: "`overwrite`, which keeps the old value and adds the new one."
      explanation: Overwrite replaces the old value, so the result is `nightly`.
    - id: d
      text: No operation is needed, because the cluster merges both values.
      explanation: The parameter writes one value to the path, and nothing merges them.
    correct_option: a
    explanation: The default operation overwrites. Append and prepend join the new value
      to the old one, and append puts it at the end.
  - id: ats063-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: Explain what an EventSource or Sensor does when it names an
      EventBus that does not exist
    source_readings:
    - sections/section-020/module-01/course-01-the-bus-in-the-cluster.md
    prompt: 'In the namespace `starfleet` the only EventBus is named `default`. A Sensor
      is created there with `spec.eventBusName: audit`. What happens?'
    options:
    - id: a
      text: The controller creates a bus named `audit` with default settings.
      explanation: The controller never creates a bus for an EventSource or a Sensor.
    - id: b
      text: The Sensor gets no pod and reports the missing bus in its status, because
        it connects only to the bus it names.
      explanation: Correct. The Sensor does not fall back to `default`. It waits until
        a bus named `audit` exists.
    - id: c
      text: The Sensor falls back to the bus `default`, because only one bus exists.
      explanation: There is no fallback. The field selects one bus by name.
    - id: d
      text: The Sensor starts and keeps its events in memory until the bus appears.
      explanation: Without a bus the Sensor has nothing to read from, and no pod starts.
    correct_option: b
    explanation: The field `eventBusName` selects a bus in the same namespace. If that
      bus does not exist, the object is not deployed.
  - id: ats063-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose the field that limits stream age and the effect of missing
      persistence
    source_readings:
    - sections/section-020/module-01/course-03-storage-settings-and-external-buses.md
    prompt: A team wants the bus to drop messages older than 24 hours and to keep its
      data when a server pod is replaced. Which configuration does this?
    options:
    - id: a
      text: "`streamConfig` with `maxAge: 24h` and `persistence` with a `volumeSize`."
      explanation: Correct. The stream limit belongs to `streamConfig`, and storage
        that survives a pod belongs to `persistence`.
    - id: b
      text: "`settings` with `maxAge: 24h`, and no further change, because the default
        storage is persistent."
      explanation: "`settings` is for the NATS server, and the default storage is an
        `emptyDir` that is lost with the pod."
    - id: c
      text: "`startArgs` with `-D` and `replicas: 1`."
      explanation: "`startArgs` adds server arguments and does not set a stream limit."
    - id: d
      text: "`jetstreamExotic` with a `maxAge` field."
      explanation: "`jetstreamExotic` connects to a service that someone else runs and
        does not set stream limits."
    correct_option: a
    explanation: Stream limits go into `streamConfig`. Without `persistence` the data
      of a pod is in an `emptyDir` and is lost when the pod is replaced.
  - id: ats063-final-q09
    type: single_choice
    difficulty: beginner
    learning_objective: Explain how a string value of a data filter is matched
    source_readings:
    - sections/section-020/module-02/course-01-filters-on-a-dependency.md
    prompt: 'A dependency has a data filter with `path: body.sensor`, `type: string`
      and `value: [hull]`. Which of the sensor names `hull`, `hull-spare` and `overhull`
      pass the filter?'
    options:
    - id: a
      text: Only `hull`, because a string value must be equal to the event value.
      explanation: A string value is a regular expression, not an equality test.
    - id: b
      text: Only `hull` and `hull-spare`, because a regular expression must match from
        the start.
      explanation: The expression is not anchored, so a match anywhere in the string
        is enough.
    - id: c
      text: All three, because the expression `hull` matches anywhere in the string.
        The value `^hull$` accepts only the first one.
      explanation: Correct. Every entry of a string filter is a regular expression,
        and anchors turn it into an exact match.
    - id: d
      text: None of them, because the path must start with `data.` instead of `body.`.
      explanation: The data of a webhook event has the keys `header` and `body`, so
        `body.sensor` is right.
    correct_option: c
    explanation: Each value of a string data filter is a regular expression that matches
      anywhere in the string, so anchors are needed for an exact match.
  - id: ats063-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain the order of transformation and filters and the rule
      for jq output
    source_readings:
    - sections/section-020/module-02/course-03-transformation.md
    prompt: 'A dependency has `transform: {jq: ".body.name"}` and a data filter on `body.name`.
      A request with the body `{"name":"hull"}` arrives. What happens to the event?'
    options:
    - id: a
      text: The filter sees the original body and accepts it, because the transformation
        runs after the filters.
      explanation: The transformation runs before the filters.
    - id: b
      text: The event is accepted, and the filter sees the string `hull`.
      explanation: The output of a transformation is not accepted when it is a string.
    - id: c
      text: The Sensor ignores the transformation, because a jq command must start with
        `event`.
      explanation: A jq command starts with a dot, and `event` is the name of the table
        in a Lua script.
    - id: d
      text: The event is discarded, because the jq command returns a string and the
        output of a transformation must be a JSON object.
      explanation: Correct. A failed transformation discards the event, and an update
        operator such as `|=` keeps the object.
    correct_option: d
    explanation: The command `.body.name` returns a string. The Sensor requires an object,
      so the transformation fails and the event is discarded before any filter runs.
  - id: ats063-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain what an HTTP trigger counts as success when no policy
      is set
    source_readings:
    - sections/section-020/module-03/course-02-trigger-policy-and-retry.md
    prompt: An HTTP trigger has no `policy`. The service it calls answers every request
      with status `503`. What does the Sensor do?
    options:
    - id: a
      text: It marks the trigger as failed and repeats it with the default of five steps.
      explanation: Without a `retryStrategy` the Sensor makes one attempt, and a status
        is not read without a policy.
    - id: b
      text: It writes a failure and sends the event to the dead letter trigger.
      explanation: A dead letter trigger runs only when the trigger fails and `atLeastOnce`
        is set.
    - id: c
      text: It treats the trigger as a success, because without `policy.status` any
        response status is accepted.
      explanation: Correct. Only a transport error fails an HTTP trigger that has no
        policy.
    - id: d
      text: It stops the Sensor pod until the service answers with `200`.
      explanation: The Sensor does not stop for a response status.
    correct_option: c
    explanation: Version 1.9.6 reads the response status only when `policy.status.allow`
      is set.
  - id: ats063-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: State the rules for dlqTrigger
    source_readings:
    - sections/section-020/module-03/course-03-delivery-guarantees.md
    prompt: 'A Sensor has a trigger with a `dlqTrigger`. The trigger itself has `atLeastOnce:
      true`, and the `dlqTrigger` has no `atLeastOnce`. What happens?'
    options:
    - id: a
      text: The Sensor runs, and the dead letter trigger runs once without waiting.
      explanation: The controller does not allow a dead letter trigger without the flag.
    - id: b
      text: The Sensor runs, and the dead letter trigger never runs.
      explanation: The Sensor does not start, so nothing runs.
    - id: c
      text: The controller sets the flag on the dead letter trigger for you.
      explanation: The controller does not change the Sensor.
    - id: d
      text: The Sensor is not deployed, and the condition `TriggersProvided` is `False`.
      explanation: Correct. The message says that `atLeastOnce` must be set within the
        dlqTrigger.
    correct_option: d
    explanation: The controller requires `atLeastOnce` true on both the trigger and
      its dead letter trigger.
  - id: ats063-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain why a replicated EventSource with Lease election publishes
      nothing without a Role
    source_readings:
    - sections/section-020/module-04/course-02-eventsource-and-sensor-pod-high-availability.md
    prompt: 'A calendar EventSource has `replicas: 2` and the annotation `events.argoproj.io/leader-election:
      k8s`. Its pods use the default ServiceAccount, which has no Role for Leases. Both
      pods are ready, but no event appears. What is the cause?'
    options:
    - id: a
      text: The EventBus has only one subject, and two pods cannot share it.
      explanation: The bus is not involved in a Lease election, and the pods are connected
        to it.
    - id: b
      text: Both pods are leaders, so the events are dropped as duplicates.
      explanation: A pod without the Lease is never a leader. The duplicates window
        plays no part here.
    - id: c
      text: The API server refused the EventSource, so the Deployment has no pods.
      explanation: The pods exist and are ready. The spec was accepted.
    - id: d
      text: No pod can create the Lease, so no pod becomes leader and the calendar timer
        never starts.
      explanation: Correct. The elector calls the API server with the ServiceAccount
        of the pod, and without get, create and update on leases there is no leader.
    correct_option: d
    explanation: An active-passive EventSource starts its event source only in the leader.
      The Lease elector needs the verbs get, create and update on leases for the ServiceAccount
      of the pod.
  - id: ats063-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain why the generated Deployment must not be scaled by hand
    source_readings:
    - sections/section-020/module-04/course-02-eventsource-and-sensor-pod-high-availability.md
    prompt: 'An engineer runs `kubectl scale` on the Deployment that the controller
      built for an EventSource, and sets three replicas. The spec of the EventSource
      says `replicas: 2`. What is true?'
    options:
    - id: a
      text: The controller reverts the Deployment to two replicas within seconds.
      explanation: The controller updates the Deployment only when the hash of the spec
        changes, so it does not revert the manual change.
    - id: b
      text: The Deployment keeps three replicas, while the election group is sized from
        the spec, so the setup is inconsistent.
      explanation: Correct. The size of the election group comes from spec.replicas,
        and the Deployment is not reconciled back.
    - id: c
      text: The EventSource changes its own spec to three replicas.
      explanation: The controller never writes the replica count into the spec.
    - id: d
      text: The API server refuses the scale, because the Deployment is owned by the
        EventSource.
      explanation: An owner reference does not block changes to the Deployment.
    correct_option: b
    explanation: Change spec.replicas on the EventSource or Sensor instead. The documentation
      says not to scale the generated Deployment manually.
  - id: ats063-final-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the fields of a NATS event"
    source_readings:
    - sections/section-010/module-04/course-02-receiving-messages-from-nats.md
    prompt: "A NATS EventSource receives messages that contain JSON, and a Sensor must read the key `ship` from the body. Which setting of the NATS event makes this possible?"
    options:
    - id: a
      text: "`subject: ship`"
      explanation: "The subject names the channel to subscribe to. It does not change how the body is carried."
    - id: b
      text: "`jsonBody: true`"
      explanation: "Correct. With this setting the body is embedded as JSON, so a path such as `body.ship` works."
    - id: c
      text: "`connectionBackoff: true`"
      explanation: "The backoff settings control how the pod retries the connection. They do not affect the body."
    - id: d
      text: "`url: nats://ship`"
      explanation: "The url names the NATS server. It does not decide how the body is carried."
    correct_option: b
    explanation: "The setting jsonBody belongs to the event next to url and subject. Without it the Sensor cannot address fields of the message."
  - id: ats063-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a plain NATS subscription does not guarantee"
    source_readings:
    - sections/section-010/module-04/course-02-receiving-messages-from-nats.md
    prompt: "The pod of a NATS EventSource is down for one minute, and a publisher sends ten messages on the subject during that minute. What happens to those messages?"
    options:
    - id: a
      text: "They are stored by NATS and delivered when the pod returns."
      explanation: "A plain NATS subject is not durable, so the server does not store messages for a subscriber that is not connected."
    - id: b
      text: "They are lost, because a plain NATS subject is not durable."
      explanation: "Correct. Only subscribers that are connected when a message is published receive it."
    - id: c
      text: "They are stored in the EventBus and replayed to the Sensor."
      explanation: "The EventBus holds only events that the EventSource published, and the pod received none of these."
    - id: d
      text: "They are refused by the controller, which stops the publisher."
      explanation: "The controller does not handle messages and has no link to the publisher."
    correct_option: b
    explanation: "A subscription type receives only what is published while it is connected. Use a durable system when messages must not be lost."
  - id: ats063-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recognize a missing permission on a Sensor"
    source_readings:
    - sections/section-020/module-05/course-01-permissions-of-the-components.md
    prompt: "A Sensor has no `serviceAccountName`, and its target is a Workflow. The Sensor is `Deployed` and its pod is `Running`. What do you see after an event?"
    options:
    - id: a
      text: "The pod restarts in a loop."
      explanation: "The pod runs normally. Only the trigger fails."
    - id: b
      text: "A `Forbidden` error in the log of the Sensor pod for the service account `default`."
      explanation: "Correct. The trigger runs with the identity of the pod and the API server refuses it."
    - id: c
      text: "An error in the log of the EventSource."
      explanation: "The EventSource has already published the event."
    - id: d
      text: "A failed condition on the EventBus."
      explanation: "The bus delivered the event."
    correct_option: b
    explanation: "The error names the identity, the verb and the resource, which is what you need to write the missing rule."
  - id: ats063-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the status of an EventSource with a missing bus"
    source_readings:
    - sections/section-020/module-05/course-04-finding-the-failing-component.md
    prompt: "An EventSource sets `eventBusName: main`, and only the bus `default` exists. What do you see?"
    options:
    - id: a
      text: "A running pod that retries the connection."
      explanation: "The controller does not create the pod without the bus."
    - id: b
      text: "`Deployed` is not true, the status names a missing bus, and the EventSource has no pod."
      explanation: "Correct. The reason is EventBusNotFound."
    - id: c
      text: "The pod uses the bus `default` instead."
      explanation: "The controller does not fall back to another bus."
    - id: d
      text: "The API server refuses the object."
      explanation: "The spec is valid. The bus is missing."
    correct_option: b
    explanation: "Remove the field to use the bus default, or create the bus that the name refers to."
  - id: ats063-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Serve a webhook over TLS"
    source_readings:
    - sections/section-010/module-02/course-04-encrypting-webhook-traffic-with-tls.md
    prompt: "A webhook event sets only `serverCertSecret`. What is the result?"
    options:
    - id: a
      text: "It serves HTTPS with a generated key."
      explanation: "Both the certificate and the key are required."
    - id: b
      text: "It does not serve HTTPS, because both `serverCertSecret` and `serverKeySecret` are needed."
      explanation: "Correct. The event needs both fields to serve HTTPS."
    - id: c
      text: "It serves HTTP on a second port."
      explanation: "There is no second port."
    - id: d
      text: "It is refused by the controller."
      explanation: "The spec is accepted, but the event does not serve HTTPS."
    correct_option: b
    explanation: "TLS needs the certificate and the key, each from a key of a Secret. The certificate must name the Service."
  - id: ats063-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find a silent Sensor"
    source_readings:
    - sections/section-010/module-03/course-04-finding-why-a-sensor-stays-silent.md
    prompt: "A Sensor is `Deployed`, its pod runs, its log has no error, and no trigger runs. What do you check first?"
    options:
    - id: a
      text: "The permissions of the service account."
      explanation: "A permission fault shows an error line."
    - id: b
      text: "The names in the dependency and the filters, starting with the log of the EventSource."
      explanation: "Correct. A silent Sensor without an error usually has a name or filter problem."
    - id: c
      text: "The version of the controller."
      explanation: "The version does not explain one silent Sensor."
    - id: d
      text: "The size of the node."
      explanation: "Resources do not cause silence without a restart or an event."
    correct_option: b
    explanation: "The controller does not check that the event named by a dependency exists, so a wrong name is not an error."
  - id: ats063-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a bus fault from the claims"
    source_readings:
    - sections/section-020/module-01/course-04-troubleshooting-the-bus.md
    prompt: "The pod `eventbus-broken-js-0` stays `Pending`. What shows the reason?"
    options:
    - id: a
      text: "The log of the pod."
      explanation: "A Pending pod has not started and has no log."
    - id: b
      text: "The events of the pod and its claim, from `kubectl describe`."
      explanation: "Correct. They name the missing storage class or the unbound claim."
    - id: c
      text: "The conditions of the EventBus, which always show the cause."
      explanation: "The conditions show what the controller did, not whether the pods are ready."
    - id: d
      text: "The log of the EventSource."
