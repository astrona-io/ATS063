apiVersion: v1
kind: Secret
metadata:
  name: dispatch-token
  namespace: starfleet
type: Opaque
stringData:
  token: fleet-4417-orbit
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: dispatch
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    order:
      port: "12000"
      endpoint: /order
      method: POST
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: dispatch
  namespace: starfleet
spec:
  template:
    serviceAccountName: event-trigger
  dependencies:
    - name: order-dep
      eventSourceName: dispatch
      eventName: order
  triggers:
    - template:
        name: run-order
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: order-
              spec:
                serviceAccountName: workflow-runner
                entrypoint: report
                arguments:
                  parameters:
                    - name: message
                      value: unset
                templates:
                  - name: report
                    inputs:
                      parameters:
                        - name: message
                    container:
                      image: docker.io/library/busybox:1.37
                      command: [echo]
                      args: ["{{inputs.parameters.message}}"]
          parameters:
            - src:
                dependencyName: order-dep
                dataKey: body.message
              dest: spec.arguments.parameters.0.value
