apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: fleet
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
      - port: 13000
        targetPort: 13000
  webhook:
    scout:
      port: "12000"
      endpoint: /scout
      method: POST
    relay:
      port: "13000"
      endpoint: /relay
      method: POST
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: launch
  namespace: starfleet
spec:
  template:
    serviceAccountName: event-trigger
  dependencies:
    - name: scout-dep
      eventSourceName: fleet
      eventName: scout
    - name: relay-dep
      eventSourceName: fleet
      eventName: relay
  triggers:
    - template:
        name: launch-ship
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: launch-
              spec:
                serviceAccountName: workflow-runner
                entrypoint: report
                arguments:
                  parameters:
                    - name: ship
                      value: unset
                templates:
                  - name: report
                    inputs:
                      parameters:
                        - name: ship
                    container:
                      image: docker.io/library/busybox:1.37
                      command: [echo]
                      args: ["{{inputs.parameters.ship}}"]
