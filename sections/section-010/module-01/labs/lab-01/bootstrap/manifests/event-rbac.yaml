apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-trigger
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: event-trigger
  namespace: starfleet
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: event-trigger
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: event-trigger
subjects:
- kind: ServiceAccount
  name: event-trigger
  namespace: starfleet
