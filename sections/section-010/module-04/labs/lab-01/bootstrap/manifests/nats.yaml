# A NATS server and a client with the nats command-line tool.
apiVersion: v1
kind: Pod
metadata:
  name: nats
  namespace: starfleet
  labels:
    app: nats
spec:
  restartPolicy: Always
  containers:
    - name: nats
      image: docker.io/library/nats:2.10.22
      ports:
        - containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: starfleet
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: v1
kind: Pod
metadata:
  name: natsbox
  namespace: starfleet
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: docker.io/natsio/nats-box:0.14.5
      command: ["sleep", "86400"]
