# RabbitMQ with the management API. User fleet, password orbit-pass.
apiVersion: v1
kind: Secret
metadata:
  name: rabbit-auth
  namespace: starfleet
stringData:
  username: fleet
  password: orbit-pass
---
apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq
  namespace: starfleet
  labels:
    app: rabbitmq
spec:
  restartPolicy: Always
  containers:
    - name: rabbitmq
      image: docker.io/library/rabbitmq:4.0.5-management
      ports:
        - containerPort: 5672
        - containerPort: 15672
      env:
        - { name: RABBITMQ_DEFAULT_USER, value: fleet }
        - { name: RABBITMQ_DEFAULT_PASS, value: orbit-pass }
      readinessProbe:
        tcpSocket:
          port: 5672
        initialDelaySeconds: 10
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: starfleet
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
