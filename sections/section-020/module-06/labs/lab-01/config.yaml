# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Prometheus Scrape Job (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-063-lab-020-06
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1

bootstrap:
  init:
    - name: setup
      description: Install Argo Workflows and Argo Events, create the Starfleet workloads and a Prometheus server for this exercise
      type: file
      source: bootstrap/setup.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: job-discovery
      description: The scrape job argo-events-controller discovers pods in the namespace argo-events
      type: file
      source: validation/validate-job-discovery.sh
      hint: "Compare the namespace in the job with the namespace of the controller."
    - name: job-port
      description: The scrape job connects to port 7777 of the controller pod
      type: file
      source: validation/validate-job-port.sh
      hint: "The controller serves its metrics on a fixed port. Test it by hand from the pod shuttle."
    - name: target-up
      description: Prometheus reports the target of the job argo-events-controller as up
      type: file
      source: validation/validate-target-up.sh
      hint: "The server reads the file only when it starts or reloads. Restart it after the change."

teardown:
  keepCluster: false
