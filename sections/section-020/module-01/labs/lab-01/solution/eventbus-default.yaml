apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: starfleet
spec:
  jetstream:
    version: 2.10.10
    replicas: 3
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
  namespace: starfleet
spec:
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    mission:
      port: '12000'
      endpoint: /mission
      method: POST
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: mission
  namespace: starfleet
spec:
  template:
    serviceAccountName: event-trigger
  dependencies:
  - name: request
    eventSourceName: webhook
    eventName: mission
  triggers:
  - template:
      name: launch
      k8s:
        operation: create
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              name: event-mission
              namespace: starfleet
            spec:
              serviceAccountName: workflow-runner
              entrypoint: produce
              activeDeadlineSeconds: 180
              templates:
              - name: produce
                container:
                  image: docker.io/library/python:3.13-alpine
                  command:
                  - python
                  - -c
                  args:
                  - open("/tmp/result","w").write("{{workflow.parameters.event-id}}")
                outputs:
                  parameters:
                  - name: result
                    valueFrom:
                      path: /tmp/result
              arguments:
                parameters:
                - name: event-id
                  value: unset
        parameters:
        - src:
            dependencyName: request
            dataKey: body.id
          dest: spec.arguments.parameters.0.value
