# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair A Pipeline That Never Runs (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-063-lab-020-05
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1

bootstrap:
  init:
    - name: setup
      description: Install Argo Workflows and Argo Events, create the Starfleet workloads and the starting objects for this exercise
      type: file
      source: bootstrap/setup.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: eventsource-running
      description: The EventSource fleet is deployed on the existing EventBus and has one ready pod
      type: file
      source: validation/validate-eventsource-running.sh
      hint: "Read the conditions of the EventSource. Compare spec.eventBusName with the name of the EventBus in starfleet."
    - name: sensor-dependency
      description: The Sensor fleet depends on the event report of the EventSource fleet
      type: file
      source: validation/validate-sensor-dependency.sh
      hint: "Compare the eventName of the dependency with the name of the webhook event in the EventSource. Keep the EventSource event name."
    - name: sensor-identity
      description: The pod of the Sensor fleet runs as a service account that may create Workflows
      type: file
      source: validation/validate-sensor-identity.sh
      hint: "Read the log of the Sensor pod after an event. Use kubectl auth can-i with --as to test the service accounts of starfleet."
    - name: pipeline-end-to-end
      description: A real request to the Service of the EventSource creates a report- Workflow that succeeds
      type: file
      source: validation/validate-pipeline-end-to-end.sh
      hint: "After each change the controller replaces a pod. Wait for one running pod before you send the request."

teardown:
  keepCluster: false
