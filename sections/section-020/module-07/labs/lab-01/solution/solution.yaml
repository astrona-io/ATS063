apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gate
  namespace: starfleet
spec:
  ingressClassName: nginx
  rules:
    - host: gate.example.test
      http:
        paths:
          - path: /report
            pathType: Exact
            backend:
              service:
                name: gate-eventsource-svc
                port:
                  number: 12000
