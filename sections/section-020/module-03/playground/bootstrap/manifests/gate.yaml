# gate: a webhook EventSource with the events relay (port 12000) and board (port 13000).
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: gate
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
      - port: 13000
        targetPort: 13000
  webhook:
    relay:
      port: "12000"
      endpoint: /relay
      method: POST
    board:
      port: "13000"
      endpoint: /board
      method: POST
