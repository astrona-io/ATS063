# gate: a webhook EventSource with the event relay on port 12000.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: gate
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    relay:
      port: "12000"
      endpoint: /relay
      method: POST
