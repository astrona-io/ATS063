# relay: forwards every relay event to the beacon. It has four faults that the learner must fix.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: relay
  namespace: starfleet
spec:
  dependencies:
    - name: gate
      eventSourceName: gate
      eventName: relay
  triggers:
    - template:
        name: notify-beacon
        http:
          url: http://beacon.starfleet.svc:8080/cgi-bin/hook
          method: POST
          headers:
            Content-Type: application/json
          payload:
            - src:
                dependencyName: gate
                dataKey: body.id
              dest: id
