apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: telemetry
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
      - port: 13000
        targetPort: 13000
      - port: 14000
        targetPort: 14000
  webhook:
    reading:
      port: "12000"
      endpoint: /reading
      method: POST
    alert:
      port: "13000"
      endpoint: /alert
      method: POST
    ack:
      port: "14000"
      endpoint: /ack
      method: POST
