# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats063-020
course_id: ATS063
exam_code: CAPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Understand Argo Event Components and Architecture"
questions:
  - id: ats063-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Explain what an EventSource or Sensor does when it names an
      EventBus that does not exist
    source_readings:
    - sections/section-020/module-01/course-01-the-bus-in-the-cluster.md
    prompt: 'In the namespace `starfleet` the only EventBus is named `default`. A Sensor
      is created there with `spec.eventBusName: audit`. What happens?'
    options:
    - id: a
      text: The controller creates a bus named `audit` with default settings.
      explanation: The controller never creates a bus for an EventSource or a Sensor.
    - id: b
      text: The Sensor gets no pod and reports the missing bus in its status, because
        it connects only to the bus it names.
      explanation: Correct. The Sensor does not fall back to `default`. It waits until
        a bus named `audit` exists.
    - id: c
      text: The Sensor falls back to the bus `default`, because only one bus exists.
      explanation: There is no fallback. The field selects one bus by name.
    - id: d
      text: The Sensor starts and keeps its events in memory until the bus appears.
      explanation: Without a bus the Sensor has nothing to read from, and no pod starts.
    correct_option: b
    explanation: The field `eventBusName` selects a bus in the same namespace. If that
      bus does not exist, the object is not deployed.
  - id: ats063-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Derive the JetStream subject of an event and the consumer layout
      of Sensors
    source_readings:
    - sections/section-020/module-01/course-02-streams-subjects-and-delivery.md
    prompt: A webhook EventSource named `gateway` has an event named `alpha`. Two Sensors
      depend on it. How is the event stored and delivered?
    options:
    - id: a
      text: It is stored on the subject `gateway.alpha`, and the two Sensors share one
        consumer so that only one of them receives it.
      explanation: The subject starts with the stream name, and each Sensor has its
        own consumer.
    - id: b
      text: It is stored in a stream named `gateway`, and each Sensor reads it with
        a push subscription.
      explanation: There is one stream named `default` for the whole bus.
    - id: c
      text: It is stored in the stream `default` on the subject `default.gateway.alpha`,
        and the two Sensors share one durable consumer, so each event goes to only one
        of them.
      explanation: The subject and the stream are right, but the Sensors do not share
        a consumer. Each has its own, so both receive the event.
    - id: d
      text: It is stored in the stream `default` on the subject `default.gateway.alpha`,
        and each Sensor has its own durable consumer, so both receive a copy.
      explanation: Correct. Durable consumers remember the position of each Sensor independently.
    correct_option: d
    explanation: All events of a bus go into the stream `default`. The subject is `default.<eventsource
      name>.<event name>`, and each Sensor reads with its own durable consumers.
  - id: ats063-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose the field that limits stream age and the effect of missing
      persistence
    source_readings:
    - sections/section-020/module-01/course-03-storage-settings-and-external-buses.md
    prompt: A team wants the bus to drop messages older than 24 hours and to keep its
      data when a server pod is replaced. Which configuration does this?
    options:
    - id: a
      text: "`streamConfig` with `maxAge: 24h` and `persistence` with a `volumeSize`."
      explanation: Correct. The stream limit belongs to `streamConfig`, and storage
        that survives a pod belongs to `persistence`.
    - id: b
      text: "`settings` with `maxAge: 24h`, and no further change, because the default
        storage is persistent."
      explanation: "`settings` is for the NATS server, and the default storage is an
        `emptyDir` that is lost with the pod."
    - id: c
      text: "`startArgs` with `-D` and `replicas: 1`."
      explanation: "`startArgs` adds server arguments and does not set a stream limit."
    - id: d
      text: "`jetstreamExotic` with a `maxAge` field."
      explanation: "`jetstreamExotic` connects to a service that someone else runs and
        does not set stream limits."
    correct_option: a
    explanation: Stream limits go into `streamConfig`. Without `persistence` the data
      of a pod is in an `emptyDir` and is lost when the pod is replaced.
  - id: ats063-020-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Explain how a string value of a data filter is matched
    source_readings:
    - sections/section-020/module-02/course-01-filters-on-a-dependency.md
    prompt: 'A dependency has a data filter with `path: body.sensor`, `type: string`
      and `value: [hull]`. Which of the sensor names `hull`, `hull-spare` and `overhull`
      pass the filter?'
    options:
    - id: a
      text: Only `hull`, because a string value must be equal to the event value.
      explanation: A string value is a regular expression, not an equality test.
    - id: b
      text: Only `hull` and `hull-spare`, because a regular expression must match from
        the start.
      explanation: The expression is not anchored, so a match anywhere in the string
        is enough.
    - id: c
      text: All three, because the expression `hull` matches anywhere in the string.
        The value `^hull$` accepts only the first one.
      explanation: Correct. Every entry of a string filter is a regular expression,
        and anchors turn it into an exact match.
    - id: d
      text: None of them, because the path must start with `data.` instead of `body.`.
      explanation: The data of a webhook event has the keys `header` and `body`, so
        `body.sensor` is right.
    correct_option: c
    explanation: Each value of a string data filter is a regular expression that matches
      anywhere in the string, so anchors are needed for an exact match.
  - id: ats063-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Predict how many triggers run for a given event sequence under
      the conditions `a-dep && b-dep`
    source_readings:
    - sections/section-020/module-02/course-02-trigger-conditions-and-reset.md
    prompt: 'A trigger has `conditions: "alert-dep && ack-dep"` and no `conditionsReset`.
      The Sensor receives the events alert, alert, ack in this order, and every event
      passes its filters. What happens?'
    options:
    - id: a
      text: The trigger runs twice, once for each alert, because each alert is stored
        and used.
      explanation: The store keeps one event for each dependency, and the second alert
        replaces the first.
    - id: b
      text: The trigger never runs, because the second alert resets the first.
      explanation: A second alert replaces the stored alert, but it does not cancel
        the dependency.
    - id: c
      text: The trigger runs once, when the ack arrives, with the second alert.
      explanation: Correct. The latest event of each dependency is used, and the stored
        events are deleted when the trigger runs.
    - id: d
      text: The trigger runs once, when the first alert arrives, and the ack is ignored.
      explanation: The expression is false until the ack has arrived.
    correct_option: c
    explanation: The first alert is stored, the second replaces it, and the ack completes
      the expression, so the trigger runs once with the second alert.
  - id: ats063-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain the order of transformation and filters and the rule
      for jq output
    source_readings:
    - sections/section-020/module-02/course-03-transformation.md
    prompt: 'A dependency has `transform: {jq: ".body.name"}` and a data filter on `body.name`.
      A request with the body `{"name":"hull"}` arrives. What happens to the event?'
    options:
    - id: a
      text: The filter sees the original body and accepts it, because the transformation
        runs after the filters.
      explanation: The transformation runs before the filters.
    - id: b
      text: The event is accepted, and the filter sees the string `hull`.
      explanation: The output of a transformation is not accepted when it is a string.
    - id: c
      text: The Sensor ignores the transformation, because a jq command must start with
        `event`.
      explanation: A jq command starts with a dot, and `event` is the name of the table
        in a Lua script.
    - id: d
      text: The event is discarded, because the jq command returns a string and the
        output of a transformation must be a JSON object.
      explanation: Correct. A failed transformation discards the event, and an update
        operator such as `|=` keeps the object.
    correct_option: d
    explanation: The command `.body.name` returns a string. The Sensor requires an object,
      so the transformation fails and the event is discarded before any filter runs.
  - id: ats063-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain what an HTTP trigger counts as success when no policy
      is set
    source_readings:
    - sections/section-020/module-03/course-02-trigger-policy-and-retry.md
    prompt: An HTTP trigger has no `policy`. The service it calls answers every request
      with status `503`. What does the Sensor do?
    options:
    - id: a
      text: It marks the trigger as failed and repeats it with the default of five steps.
      explanation: Without a `retryStrategy` the Sensor makes one attempt, and a status
        is not read without a policy.
    - id: b
      text: It writes a failure and sends the event to the dead letter trigger.
      explanation: A dead letter trigger runs only when the trigger fails and `atLeastOnce`
        is set.
    - id: c
      text: It treats the trigger as a success, because without `policy.status` any
        response status is accepted.
      explanation: Correct. Only a transport error fails an HTTP trigger that has no
        policy.
    - id: d
      text: It stops the Sensor pod until the service answers with `200`.
      explanation: The Sensor does not stop for a response status.
    correct_option: c
    explanation: Version 1.9.6 reads the response status only when `policy.status.allow`
      is set.
  - id: ats063-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain the condition under which retryStrategy and dlqTrigger
      take effect
    source_readings:
    - sections/section-020/module-03/course-03-delivery-guarantees.md
    prompt: 'A trigger has `policy.status.allow: [200]` and `retryStrategy` with `steps:
      3`, but no `atLeastOnce`. The service answers `503`. How many requests does the
      service receive for one event?'
    options:
    - id: a
      text: Three, because the retry strategy repeats the failed request.
      explanation: Without `atLeastOnce` the Sensor does not wait for the trigger, so
        it never sees the failure.
    - id: b
      text: One, because the trigger runs in the background and its failure is only
        written to the log.
      explanation: Correct. The retry only sees a failure when the Sensor waits for
        the trigger.
    - id: c
      text: Five, because the default `steps` value is used when the flag is missing.
      explanation: The default of five applies only when `steps` is `0` or missing in
        a retry strategy that is used.
    - id: d
      text: None, because the Sensor is not deployed without `atLeastOnce`.
      explanation: Only a `dlqTrigger` requires the flag, and this Sensor has none.
    correct_option: b
    explanation: With `atLeastOnce` false the trigger runs in the background and counts
      as done at once.
  - id: ats063-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: State the rules for dlqTrigger
    source_readings:
    - sections/section-020/module-03/course-03-delivery-guarantees.md
    prompt: 'A Sensor has a trigger with a `dlqTrigger`. The trigger itself has `atLeastOnce:
      true`, and the `dlqTrigger` has no `atLeastOnce`. What happens?'
    options:
    - id: a
      text: The Sensor runs, and the dead letter trigger runs once without waiting.
      explanation: The controller does not allow a dead letter trigger without the flag.
    - id: b
      text: The Sensor runs, and the dead letter trigger never runs.
      explanation: The Sensor does not start, so nothing runs.
    - id: c
      text: The controller sets the flag on the dead letter trigger for you.
      explanation: The controller does not change the Sensor.
    - id: d
      text: The Sensor is not deployed, and the condition `TriggersProvided` is `False`.
      explanation: Correct. The message says that `atLeastOnce` must be set within the
        dlqTrigger.
    correct_option: d
    explanation: The controller requires `atLeastOnce` true on both the trigger and
      its dead letter trigger.
  - id: ats063-020-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain why a replicated EventSource with Lease election publishes
      nothing without a Role
    source_readings:
    - sections/section-020/module-04/course-02-eventsource-and-sensor-pod-high-availability.md
    prompt: 'A calendar EventSource has `replicas: 2` and the annotation `events.argoproj.io/leader-election:
      k8s`. Its pods use the default ServiceAccount, which has no Role for Leases. Both
      pods are ready, but no event appears. What is the cause?'
    options:
    - id: a
      text: The EventBus has only one subject, and two pods cannot share it.
      explanation: The bus is not involved in a Lease election, and the pods are connected
        to it.
    - id: b
      text: Both pods are leaders, so the events are dropped as duplicates.
      explanation: A pod without the Lease is never a leader. The duplicates window
        plays no part here.
    - id: c
      text: The API server refused the EventSource, so the Deployment has no pods.
      explanation: The pods exist and are ready. The spec was accepted.
    - id: d
      text: No pod can create the Lease, so no pod becomes leader and the calendar timer
        never starts.
      explanation: Correct. The elector calls the API server with the ServiceAccount
        of the pod, and without get, create and update on leases there is no leader.
    correct_option: d
    explanation: An active-passive EventSource starts its event source only in the leader.
      The Lease elector needs the verbs get, create and update on leases for the ServiceAccount
      of the pod.
  - id: ats063-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: Choose the right high availability group for an EventSource
      type
    source_readings:
    - sections/section-020/module-04/course-02-eventsource-and-sensor-pod-high-availability.md
    prompt: Which statement about running two pods of an EventSource is correct?
    options:
    - id: a
      text: A webhook EventSource is active-active, and a calendar EventSource is active-passive.
      explanation: Correct. A webhook receives requests through a Service, and a calendar
        creates events itself, so only one pod may run it.
    - id: b
      text: Both types are active-passive, because every EventSource needs a leader.
      explanation: Request-driven types such as webhook serve traffic on every pod and
        start no election.
    - id: c
      text: A webhook EventSource is active-passive, and a calendar EventSource is active-active.
      explanation: This is reversed. Two calendar timers would publish every event twice.
    - id: d
      text: Both types are active-active, and the Sensor removes the duplicates.
      explanation: A Sensor does not remove duplicate events from a calendar, so the
        type must run on one pod.
    correct_option: a
    explanation: The documentation lists webhook among the active-active types and calendar
      among the active-passive types.
  - id: ats063-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain why the generated Deployment must not be scaled by hand
    source_readings:
    - sections/section-020/module-04/course-02-eventsource-and-sensor-pod-high-availability.md
    prompt: 'An engineer runs `kubectl scale` on the Deployment that the controller
      built for an EventSource, and sets three replicas. The spec of the EventSource
      says `replicas: 2`. What is true?'
    options:
    - id: a
      text: The controller reverts the Deployment to two replicas within seconds.
      explanation: The controller updates the Deployment only when the hash of the spec
        changes, so it does not revert the manual change.
    - id: b
      text: The Deployment keeps three replicas, while the election group is sized from
        the spec, so the setup is inconsistent.
      explanation: Correct. The size of the election group comes from spec.replicas,
        and the Deployment is not reconciled back.
    - id: c
      text: The EventSource changes its own spec to three replicas.
      explanation: The controller never writes the replica count into the spec.
    - id: d
      text: The API server refuses the scale, because the Deployment is owned by the
        EventSource.
      explanation: An owner reference does not block changes to the Deployment.
    correct_option: b
    explanation: Change spec.replicas on the EventSource or Sensor instead. The documentation
      says not to scale the generated Deployment manually.
  - id: ats063-020-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Test a service account with can-i"
    source_readings:
    - sections/section-020/module-05/course-01-permissions-of-the-components.md
    prompt: "Which command tests whether the service account `event-trigger` in `starfleet` may create Workflows?"
    options:
    - id: a
      text: "`kubectl get workflows --as event-trigger`"
      explanation: "This lists Workflows and uses a user name, not the service account form."
    - id: b
      text: "`kubectl auth can-i create workflows.argoproj.io -n starfleet --as=system:serviceaccount:starfleet:event-trigger`"
      explanation: "Correct. It prints yes or no for that identity."
    - id: c
      text: "`kubectl describe serviceaccount event-trigger`"
      explanation: "This shows the account, not what it may do."
    - id: d
      text: "`kubectl top serviceaccount event-trigger`"
      explanation: "There is no such command."
    correct_option: b
    explanation: "A service account is written as system:serviceaccount:<namespace>:<name> in the --as flag."
  - id: ats063-020-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recognize a missing permission on a Sensor"
    source_readings:
    - sections/section-020/module-05/course-01-permissions-of-the-components.md
    prompt: "A Sensor has no `serviceAccountName`, and its target is a Workflow. The Sensor is `Deployed` and its pod is `Running`. What do you see after an event?"
    options:
    - id: a
      text: "The pod restarts in a loop."
      explanation: "The pod runs normally. Only the trigger fails."
    - id: b
      text: "A `Forbidden` error in the log of the Sensor pod for the service account `default`."
      explanation: "Correct. The trigger runs with the identity of the pod and the API server refuses it."
    - id: c
      text: "An error in the log of the EventSource."
      explanation: "The EventSource has already published the event."
    - id: d
      text: "A failed condition on the EventBus."
      explanation: "The bus delivered the event."
    correct_option: b
    explanation: "The error names the identity, the verb and the resource, which is what you need to write the missing rule."
  - id: ats063-020-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Know which identity runs a trigger"
    source_readings:
    - sections/section-020/module-05/course-01-permissions-of-the-components.md
    prompt: "Which identity does a Kubernetes trigger use to create its object?"
    options:
    - id: a
      text: "The service account of the controller."
      explanation: "The controller builds the pods and does not run triggers."
    - id: b
      text: "The service account of the Sensor pod."
      explanation: "Correct. The trigger runs inside the Sensor pod."
    - id: c
      text: "The service account of the EventSource pod."
      explanation: "The EventSource only publishes events."
    - id: d
      text: "The user who applied the Sensor."
      explanation: "The pod does not act as the user."
    correct_option: b
    explanation: "The identity is set in spec.template.serviceAccountName, or it is default when the field is empty."
  - id: ats063-020-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Set the log level of a component"
    source_readings:
    - sections/section-020/module-05/course-02-metrics-and-logs.md
    prompt: "How do you set the log level of an EventSource pod to debug?"
    options:
    - id: a
      text: "Set the environment variable `LOG_LEVEL` in the container of `spec.template`."
      explanation: "Correct. The controller replaces the pod with the new setting."
    - id: b
      text: "Run `kubectl logs --level=debug`."
      explanation: "The logs command has no level flag."
    - id: c
      text: "Add a label `debug: \"true\"` to the pod."
      explanation: "Labels do not change logging."
    - id: d
      text: "Edit the ConfigMap of the EventBus."
      explanation: "The bus configuration does not set the log level of an EventSource."
    correct_option: a
    explanation: "The log level is an environment variable of the container, and a change replaces the pod."
  - id: ats063-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the metrics of the controller"
    source_readings:
    - sections/section-020/module-05/course-02-metrics-and-logs.md
    prompt: "On which port and path does the controller serve its Prometheus metrics?"
    options:
    - id: a
      text: "Port 7777, path `/metrics`."
      explanation: "Correct. Print the page from a pod in the cluster to see the names of your version."
    - id: b
      text: "Port 12000, path `/events`."
      explanation: "Port 12000 is the example port of a webhook in this course."
    - id: c
      text: "Port 4222, path `/stats`."
      explanation: "Port 4222 is the client port of the EventBus."
    - id: d
      text: "Port 443, path `/healthz`."
      explanation: "This is not the metrics endpoint."
    correct_option: a
    explanation: "Confirm metric names against the page of your version before building a dashboard."
  - id: ats063-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Select the pods of an object for logs"
    source_readings:
    - sections/section-020/module-05/course-02-metrics-and-logs.md
    prompt: "Which command reads the logs of all pods of the Sensor `fleet`?"
    options:
    - id: a
      text: "`kubectl -n starfleet logs -l sensor-name=fleet`"
      explanation: "Correct. The controller labels the pods with sensor-name."
    - id: b
      text: "`kubectl -n starfleet logs sensor/fleet`"
      explanation: "A Sensor is not a pod and has no log."
    - id: c
      text: "`kubectl -n argo-events logs -l sensor-name=fleet`"
      explanation: "The pods are in the namespace of the Sensor."
    - id: d
      text: "`kubectl -n starfleet logs eventbus/default`"
      explanation: "That reads the bus, not the Sensor."
    correct_option: a
    explanation: "Use the labels eventsource-name and sensor-name to select the pods that the controller built."
  - id: ats063-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know that a NetworkPolicy needs enforcement"
    source_readings:
    - sections/section-020/module-05/course-03-limiting-network-access.md
    prompt: "A NetworkPolicy that blocks other namespaces is applied, and a request from another namespace still succeeds. What is the likely reason?"
    options:
    - id: a
      text: "The EventSource ignores policies."
      explanation: "Policies act on the network, not on the EventSource."
    - id: b
      text: "The network plugin of the cluster does not enforce NetworkPolicy."
      explanation: "Correct. The API server accepts the object even when nothing enforces it."
    - id: c
      text: "The policy needs the label `eventsource-name` on the Service."
      explanation: "The policy selects pods, not Services."
    - id: d
      text: "The controller removed the policy."
      explanation: "The controller does not manage your policies."
    correct_option: b
    explanation: "Test a policy with a request that must fail before you rely on it."
  - id: ats063-020-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "List what a restricted EventSource pod needs"
    source_readings:
    - sections/section-020/module-05/course-03-limiting-network-access.md
    prompt: "You add an egress policy to the pods of an EventSource. Which destinations must it still allow?"
    options:
    - id: a
      text: "Only the sender of the events."
      explanation: "The pod receives from senders. It does not connect to them."
    - id: b
      text: "The EventBus on port 4222, DNS, and the broker for an outgoing type."
      explanation: "Correct. Without the bus it cannot publish, and without DNS it cannot resolve names."
    - id: c
      text: "Only the Kubernetes API server."
      explanation: "A Sensor needs the API server for triggers. An EventSource needs the bus."
    - id: d
      text: "No destination. Egress is not used by an EventSource."
      explanation: "The pod connects out to the bus."
    correct_option: b
    explanation: "A policy with an egress type denies everything it does not list."
  - id: ats063-020-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the status of an EventSource with a missing bus"
    source_readings:
    - sections/section-020/module-05/course-04-finding-the-failing-component.md
    prompt: "An EventSource sets `eventBusName: main`, and only the bus `default` exists. What do you see?"
    options:
    - id: a
      text: "A running pod that retries the connection."
      explanation: "The controller does not create the pod without the bus."
    - id: b
      text: "`Deployed` is not true, the status names a missing bus, and the EventSource has no pod."
      explanation: "Correct. The reason is EventBusNotFound."
    - id: c
      text: "The pod uses the bus `default` instead."
      explanation: "The controller does not fall back to another bus."
    - id: d
      text: "The API server refuses the object."
      explanation: "The spec is valid. The bus is missing."
    correct_option: b
    explanation: "Remove the field to use the bus default, or create the bus that the name refers to."
  - id: ats063-020-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Locate a wrong event name"
    source_readings:
    - sections/section-020/module-05/course-04-finding-the-failing-component.md
    prompt: "The EventSource log shows an event, the Sensor log shows nothing, and no error appears. Which fault fits?"
    options:
    - id: a
      text: "The Sensor has no service account."
      explanation: "That would show a Forbidden error after the event arrives."
    - id: b
      text: "The dependency names a different `eventName` than the EventSource event."
      explanation: "Correct. A dependency matches on the EventSource name and the event name together."
    - id: c
      text: "The Workflow image does not exist."
      explanation: "That happens after the trigger, and the Sensor would log the trigger."
    - id: d
      text: "The controller is not running."
      explanation: "The pods are running and the EventSource published the event."
    correct_option: b
    explanation: "Follow the event from the sender to the Workflow and stop at the first step that shows no line."
  - id: ats063-020-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a bus fault from the claims"
    source_readings:
    - sections/section-020/module-01/course-04-troubleshooting-the-bus.md
    prompt: "The pod `eventbus-broken-js-0` stays `Pending`. What shows the reason?"
    options:
    - id: a
      text: "The log of the pod."
      explanation: "A Pending pod has not started and has no log."
    - id: b
      text: "The events of the pod and its claim, from `kubectl describe`."
      explanation: "Correct. They name the missing storage class or the unbound claim."
    - id: c
      text: "The conditions of the EventBus, which always show the cause."
      explanation: "The conditions show what the controller did, not whether the pods are ready."
    - id: d
      text: "The log of the EventSource."
      explanation: "The EventSource only reports its own connection."
    correct_option: b
    explanation: "Check the EventBus status, the StatefulSet, the pods and claims, and then the events of the pod."
  - id: ats063-020-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine filter types"
    source_readings:
    - sections/section-020/module-02/course-04-expression-script-and-time-filters.md
    prompt: "A dependency has an expression filter and a time filter. How are they combined by default, and how do you change it?"
    options:
    - id: a
      text: "With `or`, and `filtersLogicalOperator: and` changes it."
      explanation: "The default is and."
    - id: b
      text: "With `and`, and `filtersLogicalOperator: or` on the dependency changes it."
      explanation: "Correct. With or, an event passes when one filter type passes."
    - id: c
      text: "They are combined with `and` and cannot be changed."
      explanation: "The operator can be changed on the dependency."
    - id: d
      text: "Only the first filter type is used."
      explanation: "All configured types are used."
    correct_option: b
    explanation: "Every filter sees one event only, and the time filter uses UTC."
  - id: ats063-020-q25
    type: single_choice
    difficulty: advanced
    learning_objective: "Chain pipelines with the HTTP trigger"
    source_readings:
    - sections/section-020/module-03/course-04-chaining-pipelines-with-the-http-trigger.md
    prompt: "An HTTP trigger calls the Service of a webhook EventSource, which starts a second pipeline. When is the first request answered?"
    options:
    - id: a
      text: "When the second pipeline has finished."
      explanation: "The pipelines are not tied together in time."
    - id: b
      text: "When the first EventSource accepts it."
      explanation: "Correct. The second pipeline runs after that."
    - id: c
      text: "When the second Sensor has run its trigger."
      explanation: "The first request does not wait for the second Sensor."
    - id: d
      text: "When the EventBus acknowledges both events."
      explanation: "The answer is sent before the bus is involved for the second pipeline."
    correct_option: b
    explanation: "Use policy.status when a refused request must count as a failed trigger."
  - id: ats063-020-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the namespace limits of a dependency"
    source_readings:
    - sections/section-020/module-04/course-04-one-controller-many-namespaces.md
    prompt: "A Sensor in `outpost` must react to an EventSource in `starfleet`. Why does it not work?"
    options:
    - id: a
      text: "The controller serves only one namespace."
      explanation: "One controller serves every namespace in the cluster installation."
    - id: b
      text: "A dependency and `eventBusName` have no namespace field, so a Sensor never reaches an EventSource in another namespace."
      explanation: "Correct. Each namespace owns its own bus, EventSources and Sensors."
    - id: c
      text: "Sensors must be in `argo-events`."
      explanation: "Sensors run in the namespace of their own pipeline."
    - id: d
      text: "The Sensor needs a ClusterRole to read events."
      explanation: "Events come over the bus, not through the API."
    correct_option: b
    explanation: "Requests from another namespace reach an EventSource through <service>.<namespace>.svc, not through a Sensor dependency."
  - id: ats063-020-q27
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the port of the controller metrics"
    source_readings:
    - sections/section-020/module-06/course-01-metrics-endpoints-of-the-components.md
    prompt: "On which port and path does the Argo Events controller serve metrics in this course?"
    options:
    - id: a
      text: "Port 9090 at `/metrics`."
      explanation: "9090 is the port of the Prometheus server."
    - id: b
      text: "Port 7777 at `/metrics`."
      explanation: "Correct. Test it from a pod with curl."
    - id: c
      text: "Port 12000 at `/stats`."
      explanation: "12000 is the port of the example webhook."
    - id: d
      text: "Port 4222 at `/healthz`."
      explanation: "4222 is the NATS client port."
    correct_option: b
    explanation: "Read the page by hand first and print its TYPE lines to see the names of your version."
  - id: ats063-020-q28
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the types of metrics"
    source_readings:
    - sections/section-020/module-06/course-01-metrics-endpoints-of-the-components.md
    prompt: "Which metric type only grows, so that you read it with a rate?"
    options:
    - id: a
      text: "A gauge."
      explanation: "A gauge goes up and down."
    - id: b
      text: "A counter."
      explanation: "Correct. A counter is the total since the start of the process."
    - id: c
      text: "A summary of a gauge."
      explanation: "A summary reports quantiles."
    - id: d
      text: "A label."
      explanation: "A label is not a metric type."
    correct_option: b
    explanation: "The line TYPE above each metric names its type."
  - id: ats063-020-q29
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use pod discovery"
    source_readings:
    - sections/section-020/module-06/course-02-scraping-the-controller.md
    prompt: "What does Prometheus need so that `kubernetes_sd_configs` with `role: pod` finds targets?"
    options:
    - id: a
      text: "A Role that lets it read ConfigMaps."
      explanation: "ConfigMaps are not what discovery lists."
    - id: b
      text: "A service account that may get, list and watch pods, for example through a ClusterRole."
      explanation: "Correct. Without it the log shows forbidden errors."
    - id: c
      text: "A Service for every pod."
      explanation: "Pod discovery does not use Services."
    - id: d
      text: "The Argo Events controller as a proxy."
      explanation: "The server calls the Kubernetes API itself."
    correct_option: b
    explanation: "The ClusterRole in the playground allows get, list and watch on pods."
  - id: ats063-020-q30
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set the target address by relabeling"
    source_readings:
    - sections/section-020/module-06/course-02-scraping-the-controller.md
    prompt: "Why does the job set `__address__` to the pod IP and the port 7777?"
    options:
    - id: a
      text: "Because Prometheus cannot read pod IPs."
      explanation: "The pod IP is a discovery label."
    - id: b
      text: "Because a pod that declares no port would otherwise give a target without a port."
      explanation: "Correct. The rule fixes the port whatever the pod declares."
    - id: c
      text: "Because it speeds up the scrape."
      explanation: "The rule does not change the speed."
    - id: d
      text: "Because the job needs a Service."
      explanation: "Pod discovery does not use Services."
    correct_option: b
    explanation: "The label __address__ is the address that Prometheus connects to."
  - id: ats063-020-q31
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell a missing target from a failing target"
    source_readings:
    - sections/section-020/module-06/course-02-scraping-the-controller.md
    prompt: "The query `up{job=\"argo-events-controller\"}` returns no series. What does it mean?"
    options:
    - id: a
      text: "The target is healthy."
      explanation: "A healthy target has the value 1."
    - id: b
      text: "No target exists for the job, so discovery finds no pod."
      explanation: "Correct. A failing target would show the value 0."
    - id: c
      text: "The target is down."
      explanation: "A down target has an up series with the value 0."
    - id: d
      text: "The scrape interval is too short."
      explanation: "The interval does not remove the series."
    correct_option: b
    explanation: "Read the targets API: no entry means a discovery fault, and an entry that is down means an address fault."
  - id: ats063-020-q32
    type: single_choice
    difficulty: intermediate
    learning_objective: "Select pods by label"
    source_readings:
    - sections/section-020/module-06/course-03-adding-scrape-jobs.md
    prompt: "How is the pod label `eventsource-name` written in a relabel rule?"
    options:
    - id: a
      text: "`eventsource-name`"
      explanation: "Relabeling uses the meta label form."
    - id: b
      text: "`__meta_kubernetes_pod_label_eventsource_name`"
      explanation: "Correct. Characters that are not letters or digits become underscores."
    - id: c
      text: "`__eventsource_name`"
      explanation: "This is not a discovery label."
    - id: d
      text: "`pod.label.eventsource-name`"
      explanation: "This is not the syntax of Prometheus."
    correct_option: b
    explanation: "Use the action keep with the regular expression .+ to keep only pods that carry the label."
  - id: ats063-020-q33
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reload the configuration safely"
    source_readings:
    - sections/section-020/module-06/course-03-adding-scrape-jobs.md
    prompt: "You applied a changed ConfigMap, and a reload call shows the old jobs. What is the safe step?"
    options:
    - id: a
      text: "Reload again immediately."
      explanation: "The file in the pod may not have changed yet."
    - id: b
      text: "Print the file in the pod, or restart the Deployment."
      explanation: "Correct. A mounted ConfigMap is refreshed after some time."
    - id: c
      text: "Delete the Service."
      explanation: "The Service does not hold the configuration."
    - id: d
      text: "Scale the controller to zero."
      explanation: "The controller does not read this file."
    correct_option: b
    explanation: "The flag --web.enable-lifecycle enables POST /-/reload, but the server reads only what is in the pod."
  - id: ats063-020-q34
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write the rule for a deleted component"
    source_readings:
    - sections/section-020/module-06/course-04-rules-for-missing-targets.md
    prompt: "The controller is deleted. Why does the rule `up == 0` stay silent?"
    options:
    - id: a
      text: "The rule has no `for` field."
      explanation: "The field only delays the alert."
    - id: b
      text: "No series exists for a target that is gone, so nothing equals 0."
      explanation: "Correct. Use absent(up{...}) to detect it."
    - id: c
      text: "Prometheus ignores deleted pods in rules."
      explanation: "Prometheus evaluates the query. The query returns nothing."
    - id: d
      text: "The rule runs once a day."
      explanation: "The rule runs at the evaluation interval."
    correct_option: b
    explanation: "A good set has one rule for a failing target and one for a missing target."
  - id: ats063-020-q35
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what the for field does"
    source_readings:
    - sections/section-020/module-06/course-04-rules-for-missing-targets.md
    prompt: "What does `for: 30s` do in an alerting rule?"
    options:
    - id: a
      text: "It repeats the alert every 30 seconds."
      explanation: "It does not repeat the alert."
    - id: b
      text: "It keeps the alert pending until the query has returned a result for 30 seconds."
      explanation: "Correct. It avoids alerts for a single failed scrape."
    - id: c
      text: "It limits the rule to 30 targets."
      explanation: "It does not count targets."
    - id: d
      text: "It sets the scrape timeout."
      explanation: "The timeout is a scrape setting."
    correct_option: b
    explanation: "The state goes from inactive to pending to firing."
  - id: ats063-020-q36
    type: single_choice
    difficulty: beginner
    learning_objective: "Know who sends the notification"
    source_readings:
    - sections/section-020/module-06/course-04-rules-for-missing-targets.md
    prompt: "Which component sends a firing alert to a person or a system?"
