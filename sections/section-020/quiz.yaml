    - id: a
      text: "The Argo Events controller."
      explanation: "The controller does not send alerts."
    - id: b
      text: "Alertmanager."
      explanation: "Correct. Prometheus only holds the state."
    - id: c
      text: "The EventBus."
      explanation: "The bus transports events."
    - id: d
      text: "The Sensor."
      explanation: "A Sensor could react to an event, but it does not receive alerts from Prometheus."
    correct_option: b
    explanation: "The playground has no Alertmanager. The rules are the part that you write."
  - id: ats063-020-q37
    type: single_choice
    difficulty: beginner
