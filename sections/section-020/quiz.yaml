    - sections/section-020/module-07/course-02-the-first-route.md
    prompt: "An Ingress has no `ingressClassName`. What happens with the ingress-nginx controller of the playground?"
    options:
    - id: a
      text: "It takes the Ingress, because it is the only controller."
      explanation: "The controller takes Ingress objects that name its class unless a default class is set."
    - id: b
      text: "No controller takes the Ingress, and requests get no route."
      explanation: "Correct in a cluster without a default class."
    - id: c
      text: "The controller creates the class."
      explanation: "The class exists already."
    - id: d
      text: "The API server refuses the object."
      explanation: "The object is valid."
    correct_option: b
    explanation: "Set ingressClassName: nginx."
  - id: ats063-020-q40
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know that the path is forwarded unchanged"
    source_readings:
    - sections/section-020/module-07/course-02-the-first-route.md
    prompt: "An Ingress path is `/events` and the webhook endpoint is `/report`. A request to `/events` is sent. What does the EventSource answer?"
    options:
    - id: a
      text: "200, because the Ingress rewrites the path."
