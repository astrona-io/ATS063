    - id: b
      text: "404, because the path `/events` reaches the EventSource unchanged."
      explanation: "Correct. The path must equal the endpoint."
    - id: c
      text: "503, because the Service has no endpoints."
      explanation: "The pod is ready, so the Service has endpoints."
    - id: d
      text: "302, a redirect to `/report`."
