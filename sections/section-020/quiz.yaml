    - id: a
      text: "It works, because the Service translates ports."
      explanation: "The target port must be the port that the pod listens on."
    - id: b
      text: "The Service accepts the connection and the pod refuses it."
      explanation: "Correct. Make the three numbers equal."
    - id: c
      text: "The EventSource changes its port."
      explanation: "The EventSource does not follow the Service."
    - id: d
      text: "The Ingress corrects the port."
