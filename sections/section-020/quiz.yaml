    - sections/section-020/module-07/course-02-the-first-route.md
    prompt: "A POST through the Ingress returns 200, and no Workflow appears. Where is the fault?"
    options:
    - id: a
      text: "In the Ingress rule."
      explanation: "The request reached the EventSource, so the route works."
    - id: b
      text: "After the EventSource, for example in the Sensor, the bus or the permissions."
      explanation: "Correct. The 200 comes from the EventSource."
    - id: c
      text: "In the controller of ingress-nginx."
      explanation: "It forwarded the request."
    - id: d
      text: "In DNS."
      explanation: "DNS is not involved in the test."
    correct_option: b
