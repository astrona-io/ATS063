# Course manifest for ATS063 - Argo Events (Certified Argo Project Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the parts the lab's question.md reading and
# the `type: lab` entry. The module's wrap-up page comes last. The section
# capstone and the section quiz close the section. Playgrounds are not listed:
# the landing page's playground marker shows them. solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS063
  title: "CAPA: Argo Events"
  description: >
    Training material covering the Argo Events domain of the Certified Argo
    Project Associate (CAPA) exam: the event flow from source to trigger,
    webhook, calendar, resource and other EventSource types such as NATS, Kafka and AMQP, Sensors with dependencies,
    filters, conditions and parameters, Kubernetes and Workflow triggers, the
    JetStream EventBus, trigger policies and delivery guarantees, and the
    controller with installation and high availability, and the permissions,
    logs, metrics with Prometheus, ingress and network limits of the components. Each module pairs a
    layered reader with an ungraded playground and a graded lab. Each section
    closes with an integration capstone. Targets Argo Events 1.9.6.

  certification:
    name: Certified Argo Project Associate
    code: CAPA
    provider: CNCF / Linux Foundation
    domain: Argo Events
    weight: 12
    competencies:
      - "Understand Argo Events Fundamentals"
      - "Understand Argo Event Components and Architecture"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how to get your machine
      ready with the astrona command-line tool, and how the content is written
      and checked.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

